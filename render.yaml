services:
  - type: web
    name: pact-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PROCESS
        value: web
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pact-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PAYEE_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_CONTRACTS
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_BUYER
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_WORKER
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_VERIFIER
        value: gemini-3.8-flash
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RECEIPT_SIGNING_KEY_ID
        sync: false
      - key: RECEIPT_SIGNING_PRIVATE_KEY_PEM
        sync: false
      - key: RECEIPT_SIGNING_PUBLIC_KEY_PEM
        sync: false
      - key: JUDGE_EMAIL
        sync: false
      - key: JUDGE_PASSWORD
        sync: false
      - key: PACT_DEPLOYMENT_LABEL
        value: Hackathon deployment

  - type: worker
    name: pact-worker
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PROCESS
        value: worker
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pact-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: APP_SECRET
        fromService:
          type: web
          name: pact-web
          envVarKey: APP_SECRET
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PAYEE_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_CONTRACTS
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_BUYER
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_WORKER
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_VERIFIER
        value: gemini-3.8-flash
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RECEIPT_SIGNING_KEY_ID
        sync: false
      - key: RECEIPT_SIGNING_PRIVATE_KEY_PEM
        sync: false
      - key: RECEIPT_SIGNING_PUBLIC_KEY_PEM
        sync: false
      - key: LIGHTHOUSE_ENABLED
        value: "true"

databases:
  - name: pact-db
    plan: basic-256mb
    postgresMajorVersion: "17"
